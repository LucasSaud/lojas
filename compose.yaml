services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      # Em produção, atrás do proxy: WEB_PORT=127.0.0.1:8080 no .env (não expõe a porta para fora).
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./storage/uploads:/var/www/html/_core/_uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    # O sistema foi escrito para MySQL sem modo estrito (várias tabelas não têm valor padrão nas colunas).
    command: --sql-mode="" --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
