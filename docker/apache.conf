ServerName localhost
ServerTokens Prod
ServerSignature Off

# As variáveis do .env chegam ao PHP (getenv) e ao .htaccess (%{ENV:APP_DOMAIN}).
PassEnv APP_DOMAIN APP_HTTPS DB_HOST DB_USER DB_PASS DB_NAME SMTP_NAME SMTP_USER SMTP_PASS
PassEnv RECAPTCHA_SITEKEY RECAPTCHA_SECRETKEY EXTERNAL_TOKEN
PassEnv APP_KEY GOOGLE_PLACES_KEY
PassEnv MP_SANDBOX MP_PUBLIC_KEY MP_ACCESS_TOKEN MP_CLIENT_ID MP_CLIENT_SECRET VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY

<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# Uploads: nunca executar scripts enviados.
<Directory /var/www/html/_core/_uploads>
    php_admin_flag engine off
    <FilesMatch "\.(php\d?|phtml|phps|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
